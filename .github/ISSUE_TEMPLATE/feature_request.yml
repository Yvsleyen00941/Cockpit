name: Feature Request
description: Suggest an idea or enhancement for Cockpit
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for contributing to Cockpit! Please describe the feature you would like to see.
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: Clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Use Case / Context
      description: Why would this be useful to you and other Mac users?
    validations:
      required: false
